name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create test database
        run: PGPASSWORD=rag psql -h localhost -p 5433 -U rag -d rag -c "CREATE DATABASE rag_test"
      - name: Run gates
        env:
          TEST_DATABASE_URL: postgresql://rag:rag@localhost:5433/rag_test
          DATABASE_URL: postgresql://rag:rag@localhost:5433/rag
        run: scripts/ci.sh
