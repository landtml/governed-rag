services:
  db:
    image: pgvector/pgvector:pg17
    environment: {POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag}
    ports: ["5433:5432"]
    shm_size: 1gb
    volumes: ["./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U rag -d rag"], interval: 2s, timeout: 2s, retries: 30}
