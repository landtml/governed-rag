[project]
name = "governed-rag"
version = "0.1.1"
description = "Governed RAG Reference Architecture: access-controlled, authority-tiered retrieval with cited, verified answers on PostgreSQL and pgvector."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "landtml" }]
requires-python = ">=3.12"
keywords = ["rag", "retrieval-augmented-generation", "pgvector", "postgresql", "hybrid-search", "access-control", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = ["psycopg[binary]>=3.2", "pgvector>=0.3", "pyyaml>=6"]

[project.optional-dependencies]
real = ["sentence-transformers>=3", "anthropic"]

[project.urls]
Repository = "https://github.com/landtml/governed-rag"
Issues = "https://github.com/landtml/governed-rag/issues"

[project.scripts]
rag = "governed_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8", "numpy>=2"]  # numpy: bench/loadtest.py and its tests

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governed_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["real: downloads models or calls a paid API"]
addopts = "-m 'not real'"
